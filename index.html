<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyLens AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>StudyLens AI</h1>

        <p class="subtitle">
            Turn your notes into summaries, important topics and MCQs.
        </p>

        <div class="upload-box">

            <h2>📄 Upload Your Notes</h2>

            <p>Select a PDF file to analyze.</p>

            <input type="file" id="pdfFile" accept=".pdf">

            <button id="analyzeBtn">
                Analyze Notes
            </button>

        </div>

        <div id="result" class="result-box">

            <h2>📊 Analysis Result</h2>

            <div class="section">
                <h3>📝 Summary</h3>
                <p id="summary">
                    Your summary will appear here.
                </p>
            </div>

            <div class="section">
                <h3>⭐ Important Topics</h3>
                <ul id="topics">
                    <li>Your important topics will appear here.</li>
                </ul>
            </div>

            <div class="section">
                <h3>❓ MCQs</h3>
                <p id="mcqs">
                    Your generated MCQs will appear here.
                </p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
